global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: modelops-api
    static_configs:
      - targets: ["127.0.0.1:8000"]

  - job_name: modelops-router
    static_configs:
      - targets: ["127.0.0.1:8004"]

  - job_name: modelops-model-server-test
    static_configs:
      - targets: ["127.0.0.1:8007"]

  - job_name: modelops-model-server-production
    static_configs:
      - targets: ["127.0.0.1:8003"]

  - job_name: modelops-model-server-staging
    static_configs:
      - targets: ["127.0.0.1:8006"]

  - job_name: modelops-celery-worker
    static_configs:
      - targets: ["127.0.0.1:8005"]
