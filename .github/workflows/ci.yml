name: AI ModelOps CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@127.0.0.1:5432/ci_test
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Validate platform version
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          version = Path("VERSION").read_text(encoding="utf-8").strip()
          pattern = r"(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)"

          if not re.fullmatch(pattern, version):
              raise SystemExit(
                  f"Invalid semantic version in VERSION: {version!r}"
              )

          print(f"Validated platform version: {version}")
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Compile Python modules
        run: |
          python -m compileall -q \
            backend \
            ml \
            model_router \
            model_server \
            worker \
            tests

      - name: Run test suite
        run: python -m pytest -q

      - name: Validate staging deployment script
        run: |
          bash -n scripts/deploy-staging.sh
          ./scripts/deploy-staging.sh --help
          echo "Staging deployment script validation passed."

      - name: Build model-server Docker image
        run: |
          PLATFORM_VERSION="$(tr -d '\r\n' < VERSION)"

          docker build \
            --build-arg PLATFORM_VERSION="${PLATFORM_VERSION}" \
            -f model_server/Dockerfile \
            -t ai-modelops-model-server:ci \
            -t "ai-modelops-model-server:${PLATFORM_VERSION}" \
            .

          IMAGE_VERSION="$(docker image inspect \
            "ai-modelops-model-server:${PLATFORM_VERSION}" \
            --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"

          test "${IMAGE_VERSION}" = "${PLATFORM_VERSION}"
          printf 'Validated Docker image version: %s\n' "${IMAGE_VERSION}"
